<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Clock Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            gap: 40px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .label {
            text-align: center;
            color: #888;
            margin-top: 15px;
            font-size: 14px;
            width: 300px;
        }
        .phone {
            width: 300px;
            height: 600px;
            border-radius: 30px;
            border: 8px solid #333;
            overflow: hidden;
            position: relative;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600"><rect fill="%23234" width="300" height="600"/><text fill="rgba(255,255,255,0.1)" font-size="14" x="20" y="100">WeChat Chat</text><text fill="rgba(255,255,255,0.1)" font-size="14" x="20" y="130">Alice: Hello!</text><text fill="rgba(255,255,255,0.1)" font-size="14" x="20" y="160">Bob: How are you?</text><circle fill="rgba(255,255,255,0.05)" cx="150" cy="500" r="30"/></svg>');
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 24px;
            background: #333;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 10;
        }

        /* The floating clock */
        .float-clock {
            position: absolute;
            top: 120px;
            right: 20px;
            background: rgba(0,0,0,0.13);
            border-radius: 12px;
            padding: 8px 14px;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: move;
            user-select: none;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .float-time {
            color: #4CAF50;
            font-size: 26px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .float-close {
            width: 18px;
            height: 18px;
            background: #666;
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <div class="phone">
            <div class="notch"></div>
            <div class="float-clock" id="floatClock">
                <span class="float-time" id="floatTime">14:32:05</span>
                <span class="float-close">x</span>
            </div>
        </div>
        <div class="label">Tap App icon = instant floating window<br>No main screen, just drag it anywhere</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('floatTime').textContent = h + ':' + m + ':' + s;
        }
        setInterval(updateTime, 1000);
        updateTime();

        const floatClock = document.getElementById('floatClock');
        let dragging = false, offsetX, offsetY;
        floatClock.addEventListener('mousedown', e => {
            if (e.target.classList.contains('float-close')) return;
            dragging = true;
            offsetX = e.clientX - floatClock.offsetLeft;
            offsetY = e.clientY - floatClock.offsetTop;
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            floatClock.style.left = (e.clientX - offsetX) + 'px';
            floatClock.style.right = 'auto';
            floatClock.style.top = (e.clientY - offsetY) + 'px';
        });
        document.addEventListener('mouseup', () => dragging = false);
    </script>
</body>
</html>

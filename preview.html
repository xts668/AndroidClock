<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Android 悬浮时钟 App 预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .phone {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            border: 12px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #333;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 10;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        .date {
            color: #fff;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .week {
            color: #aaa;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 32px;
        }
        .time {
            color: #4CAF50;
            font-size: 72px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 4px;
        }
        .colon {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 模拟悬浮小窗口 */
        .floating-window {
            position: absolute;
            top: 120px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            padding: 12px 20px;
            border: 1px solid rgba(76, 175, 80, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 100;
            cursor: move;
            user-select: none;
        }
        .floating-window .float-time {
            color: #4CAF50;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }
        .floating-window .float-label {
            color: #888;
            font-size: 10px;
            text-align: center;
            margin-top: 4px;
        }
        .floating-window .float-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #E53935;
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 主界面按钮 */
        .btn {
            margin-top: 64px;
            padding: 16px 48px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .hint {
            margin-top: 16px;
            color: #888;
            font-size: 14px;
        }

        .label {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            white-space: nowrap;
        }
        .badge {
            position: absolute;
            top: 60px;
            left: 20px;
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="notch"></div>
        <div class="screen">
            <div class="badge">悬浮窗模式</div>

            <!-- 模拟悬浮小窗口 -->
            <div class="floating-window" id="floatingWindow">
                <div class="float-close">×</div>
                <div class="float-time" id="floatTime">15:52:30</div>
                <div class="float-label">可拖动</div>
            </div>

            <div class="date" id="date">2026年08月26日</div>
            <div class="week" id="week">星期三</div>
            <div class="time" id="time">15<span class="colon">:</span>52<span class="colon">:</span>30</div>

            <button class="btn" id="toggleBtn" onclick="toggleFloating()">关闭悬浮时钟</button>
            <div class="hint">开启后可拖动小窗口到任意位置</div>
        </div>
        <div class="label">Android 悬浮时钟 App 运行效果预览</div>
    </div>

    <script>
        let floatingVisible = true;

        function updateClock() {
            const now = new Date();
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('date').textContent = `${year}年${month}月${day}日`;
            document.getElementById('week').textContent = weekDays[now.getDay()];
            document.getElementById('time').innerHTML =
                `${hours}<span class="colon">:</span>${minutes}<span class="colon">:</span>${seconds}`;
            document.getElementById('floatTime').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function toggleFloating() {
            const fw = document.getElementById('floatingWindow');
            const btn = document.getElementById('toggleBtn');
            floatingVisible = !floatingVisible;
            fw.style.display = floatingVisible ? 'block' : 'none';
            btn.textContent = floatingVisible ? '关闭悬浮时钟' : '开启悬浮时钟';
            btn.style.background = floatingVisible ? '#E53935' : '#4CAF50';
        }

        // 模拟拖动
        const fw = document.getElementById('floatingWindow');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        fw.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('float-close')) {
                toggleFloating();
                return;
            }
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = fw.offsetLeft;
            initialTop = fw.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            fw.style.left = (initialLeft + e.clientX - startX) + 'px';
            fw.style.top = (initialTop + e.clientY - startY) + 'px';
            fw.style.right = 'auto';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>

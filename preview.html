<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Clock Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            gap: 40px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .label {
            text-align: center;
            color: #888;
            margin-top: 15px;
            font-size: 14px;
            width: 300px;
        }
        .phone {
            width: 300px;
            height: 600px;
            border-radius: 30px;
            border: 8px solid #333;
            overflow: hidden;
            position: relative;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600"><rect fill="%23234" width="300" height="600"/><text fill="rgba(255,255,255,0.1)" font-size="14" x="20" y="100">Home Screen</text><text fill="rgba(255,255,255,0.1)" font-size="14" x="20" y="130">App icons...</text><circle fill="rgba(255,255,255,0.05)" cx="150" cy="500" r="30"/></svg>');
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 24px;
            background: #333;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 10;
        }

        /* Floating Main Window */
        .float-main {
            position: absolute;
            top: 100px;
            left: 10px;
            width: 260px;
            background: rgba(26, 26, 46, 0.93);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            cursor: move;
            user-select: none;
            z-index: 20;
        }
        .float-main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .float-main-title { color: #888; font-size: 12px; font-weight: 500; }
        .float-main-close { color: #888; font-size: 14px; font-weight: bold; cursor: pointer; }
        .float-main-date { color: #aaa; font-size: 12px; text-align: center; margin-bottom: 4px; }
        .float-main-time {
            color: #4CAF50;
            font-size: 36px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-align: center;
            letter-spacing: 1px;
        }
        .float-main-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: none;
            background: #4CAF50;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .float-main-dev {
            margin-top: 8px;
            text-align: center;
            color: #555;
            font-size: 10px;
        }

        /* Service floating window */
        .float-service {
            position: absolute;
            top: 350px;
            right: 20px;
            background: rgba(0,0,0,0.27);
            border-radius: 12px;
            padding: 10px 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            z-index: 30;
        }
        .float-service-time {
            color: #4CAF50;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div>
        <div class="phone">
            <div class="notch"></div>
            <div class="float-main" id="floatMain">
                <div class="float-main-header">
                    <span class="float-main-title">Clock</span>
                    <span class="float-main-close">X</span>
                </div>
                <div class="float-main-date" id="mainDate">2026-08-27</div>
                <div class="float-main-time" id="mainTime">14:32:05</div>
                <button class="float-main-btn">Start</button>
                <div class="float-main-dev">Developer: xts</div>
            </div>
        </div>
        <div class="label">Main Window (Floating Dialog)</div>
    </div>

    <div>
        <div class="phone">
            <div class="notch"></div>
            <div style="padding:20px;color:rgba(255,255,255,0.3);font-size:14px;line-height:2;">
                Chat App<br>
                Alice: Hello!<br>
                Bob: How are you?<br>
                ...<br>
                You can still tap here!<br>
                The service float is on top.
            </div>
            <div class="float-service" id="floatService">
                <div class="float-service-time" id="serviceTime">14:32:05</div>
            </div>
        </div>
        <div class="label">Service Float (Over Other Apps)</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const str = h + ':' + m + ':' + s;
            const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            document.getElementById('mainTime').textContent = str;
            document.getElementById('serviceTime').textContent = str;
            document.getElementById('mainDate').textContent = dateStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Draggable main window
        const floatMain = document.getElementById('floatMain');
        let dragging = false, offsetX, offsetY;
        floatMain.addEventListener('mousedown', e => {
            if (e.target.classList.contains('float-main-close') || e.target.tagName === 'BUTTON') return;
            dragging = true;
            offsetX = e.clientX - floatMain.offsetLeft;
            offsetY = e.clientY - floatMain.offsetTop;
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            floatMain.style.left = (e.clientX - offsetX) + 'px';
            floatMain.style.top = (e.clientY - offsetY) + 'px';
        });
        document.addEventListener('mouseup', () => dragging = false);
    </script>
</body>
</html>
